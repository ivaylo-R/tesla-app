project_id = "tesla-app"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "teslaapp://auth/callback"
additional_redirect_urls = ["teslaapp://auth/callback", "teslaapp://auth/callback?flow=recovery", "teslaapp://auth/reset-password?flow=recovery", "exp://**/--/auth/callback**", "exp://**/--/auth/reset-password**", "exps://**/--/auth/reset-password**", "http://localhost:8085/**"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
